name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: pip-audit (fail on HIGH/CRITICAL)
        working-directory: backend
        run: pip-audit --desc --fail-on high

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: npm audit (production, HIGH+)
        working-directory: frontend
        run: npm audit --production --audit-level=high

  test:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidya
          POSTGRES_PASSWORD: vidya_ci
          POSTGRES_DB: vidya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vidya"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://vidya:vidya_ci@localhost:5432/vidya
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-for-testing-only-not-for-production-xxxxxxxxxx
          ENVIRONMENT: development
        run: >-
          pytest tests/ -x -q --tb=short
          --cov=app
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  helm-validate:
    name: Helm Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm 3.14
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm lint (dev / staging / prod)
        run: bash infra/helm/lint.sh
