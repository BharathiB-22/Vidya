name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: pip-audit (fail on HIGH/CRITICAL)
        working-directory: backend
        run: pip-audit --desc --fail-on high

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: npm audit (production, HIGH+)
        working-directory: frontend
        run: npm audit --production --audit-level=high

  test:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidya
          POSTGRES_PASSWORD: vidya_ci
          POSTGRES_DB: vidya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vidya"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev deps
        working-directory: backend
        run: pip install ".[dev]"

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://vidya:vidya_ci@localhost:5432/vidya
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-for-testing-only-not-for-production-xxxxxxxxxx
          ENVIRONMENT: development
        run: >-
          pytest tests/ -x -q --tb=short
          --cov=app
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git log range

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.20.1/gitleaks_8.20.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks (scan new commits only)
        # Scans only the commits introduced by this push or PR, not the full
        # history. A one-time baseline audit of the full git history must be
        # run manually before first staging deploy (see infra/docs/).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
          fi
          gitleaks detect \
            --config=gitleaks.toml \
            --log-opts="$RANGE" \
            --redact \
            --exit-code 1

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit==1.8.3

      - name: Run bandit (medium+ severity, high+ confidence)
        # -ll = medium+ severity  (LOW is noisy in FastAPI / SQLAlchemy codebases)
        # -i  = high+ confidence  (reduces false positives from heuristic checks)
        # app/workers is excluded: Celery entrypoints call subprocess to run
        # student code in a sandboxed tmp dir — this is intentional and reviewed.
        working-directory: backend
        run: bandit -r app -ll -i -x app/workers --format txt

  helm-validate:
    name: Helm Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm 3.14
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm lint (dev / staging / prod)
        run: bash infra/helm/lint.sh
