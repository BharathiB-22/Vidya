name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ── Shared quality gates (same as CI) ────────────────────────────────────────
  checks:
    uses: ./.github/workflows/ci-checks.yml

  # ── Migration dry-run (destructive DDL scan + apply + rollback) ───────────────
  migration-dryrun:
    name: Migration Dry-Run & Rollback Check
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidya
          POSTGRES_PASSWORD: vidya_ci
          POSTGRES_DB: vidya
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vidya"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: pip install .

      - name: Run migration check
        env:
          DATABASE_URL: postgresql+asyncpg://vidya:vidya_ci@localhost:5432/vidya
          JWT_SECRET: ci-jwt-secret-for-testing-only-not-for-production-xxxxxxxxxx
          ENVIRONMENT: development
        run: bash infra/scripts/migration-check.sh

  # ── Build Docker images and push to GHCR ─────────────────────────────────────
  build-push:
    name: Build & Push (${{ matrix.name }})
    needs: [migration-dryrun]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write    # required for Cosign keyless signing via GitHub OIDC
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            image: ghcr.io/BharathiB-22/vidya/api
          - name: frontend
            context: frontend
            image: ghcr.io/BharathiB-22/vidya/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

  # ── Staging deploy (workflow_dispatch only) ───────────────────────────────────
  staging-deploy:
    name: Staging Deploy
    needs: [build-push]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm 3.14
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install vidya ./infra/helm/vidya \
            -f infra/helm/vidya/values.staging.yaml \
            --namespace vidya-system \
            --create-namespace \
            --atomic \
            --timeout=5m \
            --set api.image.tag=${{ github.sha }} \
            --set worker.image.tag=${{ github.sha }} \
            --set workerHeavy.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set migrate.image.tag=${{ github.sha }}

  # ── Staging smoke tests ───────────────────────────────────────────────────────
  staging-smoke:
    name: Staging Smoke Tests
    needs: [staging-deploy]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Wait for API rollout
        run: kubectl rollout status deployment/vidya-api -n vidya-system --timeout=3m

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/vidya-frontend -n vidya-system --timeout=3m

      - name: API health check (/healthz)
        run: >-
          curl -f
          --retry 5
          --retry-delay 10
          --retry-connrefused
          https://staging.vidya.fidelitus.com/healthz

      - name: API ready check (/ready)
        run: >-
          curl -f
          --retry 5
          --retry-delay 10
          --retry-connrefused
          https://staging.vidya.fidelitus.com/ready

      - name: Frontend root check (/)
        run: >-
          curl -f
          --retry 5
          --retry-delay 10
          --retry-connrefused
          https://staging.vidya.fidelitus.com/

  # ── Production deploy (workflow_dispatch + manual approval gate) ──────────────
  # Prerequisites before first use:
  #   1. Create GitHub environment named "production" in repo Settings → Environments
  #   2. Add "Required reviewers" — minimum 1 (Srinivas)
  #   3. Set KUBE_CONFIG_PROD secret in the "production" environment
  # Flow: staging-smoke must pass → reviewer approves → prod helm upgrade runs
  prod-deploy:
    name: Production Deploy
    needs: [staging-smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production   # pauses here for manual approval from required reviewers
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm 3.14
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Set up kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Helm upgrade (production)
        run: |
          helm upgrade --install vidya ./infra/helm/vidya \
            -f infra/helm/vidya/values.prod.yaml \
            --namespace vidya-system \
            --create-namespace \
            --atomic \
            --timeout=8m \
            --set api.image.tag=${{ github.sha }} \
            --set worker.image.tag=${{ github.sha }} \
            --set workerHeavy.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set migrate.image.tag=${{ github.sha }}

  # ── Production smoke tests ────────────────────────────────────────────────────
  prod-smoke:
    name: Production Smoke Tests
    needs: [prod-deploy]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_B64" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Wait for API rollout
        run: kubectl rollout status deployment/vidya-api -n vidya-system --timeout=5m

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/vidya-frontend -n vidya-system --timeout=5m

      - name: API health check (/healthz)
        run: >-
          curl -f
          --retry 5
          --retry-delay 15
          --retry-connrefused
          https://vidya.fidelitus.com/healthz

      - name: API ready check (/ready)
        run: >-
          curl -f
          --retry 5
          --retry-delay 15
          --retry-connrefused
          https://vidya.fidelitus.com/ready

      - name: Frontend root check (/)
        run: >-
          curl -f
          --retry 5
          --retry-delay 15
          --retry-connrefused
          https://vidya.fidelitus.com/
