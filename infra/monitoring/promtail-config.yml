server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=vidya"]

    relabel_configs:
      # container label: strip leading slash from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # service label: from Docker Compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

    pipeline_stages:
      # Extract level from JSON logs (vidya-api / vidya-worker emit JSON)
      # Non-JSON lines (postgres, redis) pass through without level label
      - json:
          expressions:
            level: level

      # Promote level to a Loki label (low cardinality: INFO/WARNING/ERROR/DEBUG)
      - labels:
          level:
