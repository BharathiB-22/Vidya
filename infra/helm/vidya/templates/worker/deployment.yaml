apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vidya.componentName" (list . "worker") }}
  labels:
    {{- include "vidya.componentLabels" (list . "worker") | nindent 4 }}
spec:
  # Replicas are omitted when KEDA manages scaling so that helm upgrade
  # does not reset the replica count mid-flight against KEDA's target.
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vidya.componentSelectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vidya.componentLabels" (list . "worker") | nindent 8 }}
    spec:
      {{- include "vidya.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vidya.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: {{ include "vidya.image" (list . .Values.worker.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          env:
            # readOnlyRootFilesystem: Celery task discovery imports all task
            # modules at startup. Some AI client libs (google-generativeai, groq)
            # write to $HOME/.cache/ on first import. HOME=/tmp redirects those
            # writes to the writable emptyDir so the worker process doesn't exit.
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          envFrom:
            {{- include "vidya.commonEnvFrom" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # Liveness: targets this specific worker instance by pod hostname.
          # 3 consecutive failures over 3 minutes (60s period) before restart,
          # giving the broker time to recover from transient unavailability.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  celery -A app.workers.celery_app inspect ping
                  --destination "celery@$HOSTNAME" --timeout 10
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
