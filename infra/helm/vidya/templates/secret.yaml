{{- /*
  secret.yaml — Direct Kubernetes Secret (LOCAL DEV / KIND path only).

  Rendered only when externalSecrets.enabled is false.
  For staging and prod, set externalSecrets.enabled: true — this file is
  skipped and externalsecret.yaml renders an ExternalSecret instead.

  DATABASE_URL / REDIS_URL are assembled from release-derived service names
  when the corresponding StatefulSet is enabled (postgres.enabled / redis.enabled),
  so the hostname always matches the actual Helm release — no hardcoding needed.
  When the StatefulSet is disabled (managed path), the verbatim value from
  secrets.databaseUrl / secrets.redisUrl is used.

  NEVER put real secret values in values.yaml.
  Override in a gitignored values file:
    helm install vidya ./infra/helm/vidya \
      -f infra/helm/vidya/values.dev.yaml
*/ -}}
{{- if not .Values.externalSecrets.enabled }}

{{- /* Build DATABASE_URL from release-derived hostname when postgres runs in-cluster. */ -}}
{{- $dbUrl := .Values.secrets.databaseUrl }}
{{- if .Values.postgres.enabled }}
{{- $dbUrl = printf "postgresql+asyncpg://vidya:%s@%s:5432/vidya" .Values.secrets.postgresPassword (include "vidya.componentName" (list . "postgres")) }}
{{- end }}

{{- /* Build REDIS_URL from release-derived hostname when redis runs in-cluster. */ -}}
{{- $redisUrl := .Values.secrets.redisUrl }}
{{- if .Values.redis.enabled }}
{{- $redisUrl = printf "redis://:%s@%s:6379/0" .Values.secrets.redisPassword (include "vidya.componentName" (list . "redis")) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vidya.fullname" . }}-secret
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
  annotations:
    # This Secret is managed by Helm.
    # To switch to ExternalSecrets: set externalSecrets.enabled=true,
    # delete this Secret, then helm upgrade. ESO will recreate it from
    # the remote store under the same name.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ── Database ───────────────────────────────────────────────────────────────
  # In-cluster path:  postgresql+asyncpg://vidya:<pass>@<release-postgres>:5432/vidya
  # Managed path:     value of secrets.databaseUrl (set in gitignored values file)
  DATABASE_URL: {{ $dbUrl | quote }}

  # Used by the postgres StatefulSet (POSTGRES_PASSWORD env var) — K-06.
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # ── Redis ──────────────────────────────────────────────────────────────────
  # In-cluster path:  redis://:<pass>@<release-redis>:6379/0
  # Managed path:     value of secrets.redisUrl
  REDIS_URL: {{ $redisUrl | quote }}

  # Used by:
  #   Redis StatefulSet (--requirepass)            — K-06
  #   Flower broker URL                            — K-07
  #   KEDA TriggerAuthentication                   — K-04
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}

  # ── Authentication ─────────────────────────────────────────────────────────
  JWT_SECRET:      {{ .Values.secrets.jwtSecret | quote }}
  EXAM_FERNET_KEY: {{ .Values.secrets.examFernetKey | quote }}

  # ── Object storage ─────────────────────────────────────────────────────────
  # Also used by MinIO StatefulSet as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD — K-06.
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}

  # ── AI providers ───────────────────────────────────────────────────────────
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  GROQ_API_KEY:   {{ .Values.secrets.groqApiKey | quote }}

  # ── Email ──────────────────────────────────────────────────────────────────
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}

  # ── Flower ────────────────────────────────────────────────────────────────
  FLOWER_USER:     {{ .Values.secrets.flowerUser | quote }}
  FLOWER_PASSWORD: {{ .Values.secrets.flowerPassword | quote }}

  # ── External APIs ──────────────────────────────────────────────────────────
  YOUTUBE_API_KEY: {{ .Values.secrets.youtubeApiKey | quote }}
{{- end }}
