{{- if .Values.serviceAccount.create }}
{{- /*
  ServiceAccount rendered as a pre-install/pre-upgrade hook at weight -10.

  WHY A HOOK?
  The migrate-job.yaml is itself a pre-install/pre-upgrade hook at weight -5.
  Helm executes hooks before normal resources, so a plain (non-hook)
  ServiceAccount would not exist yet when the migrate Job pod starts —
  causing: "serviceaccount not found" and a forbidden pod error.

  Making this SA a hook at weight -10 (lower weight = runs first) guarantees:
    1. ServiceAccount created  (hook weight -10)
    2. migrate Job runs        (hook weight  -5)
    3. Normal resources deployed (Deployments, StatefulSets, etc.)

  hook-delete-policy: before-hook-creation
    The SA is deleted and recreated only at the start of the NEXT
    install/upgrade, picking up any new annotations (e.g. Workload Identity,
    IRSA). It persists between upgrades so running pods are never interrupted.
    Kubernetes projected service-account tokens in existing pods remain valid
    for their remaining TTL even if the SA is briefly deleted; new pods get
    fresh tokens from the recreated SA.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vidya.serviceAccountName" . }}
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
