{{- /*
  externalsecret.yaml — ESO ExternalSecret (STAGING / PROD path).

  Rendered only when externalSecrets.enabled: true.
  Syncs secrets from the configured backend into a Kubernetes Secret named
  "<release>-secret" — the same name the dev path uses (secret.yaml).
  Deployment envFrom references require no change between deployment paths.

  VAULT KV v2 LAYOUT
  ──────────────────
  All secrets for one environment live in a SINGLE Vault KV entry:

    Mount:    secret   (KV v2)
    Staging:  secret/data/vidya/staging
    Prod:     secret/data/vidya/prod

  values.staging.yaml:  externalSecrets.remoteKeyPrefix: "vidya/staging"
  values.prod.yaml:     externalSecrets.remoteKeyPrefix: "vidya/prod"

  Every remoteRef below shares the same key (remoteKeyPrefix) and uses
  `property:` to extract the individual field from that KV entry.

  CRITICAL: Vault KV v2 REQUIRES the `property:` field on each remoteRef.
  Without it, ESO serialises the entire KV data object as a JSON string
  and writes {"DATABASE_URL":"...",...} as the raw value — the app then
  receives an unparseable JSON blob instead of the actual credential.
  This bug is silent: the Secret is created and looks populated, but
  every secret-dependent operation (login, DB queries, file uploads) fails.

  Vault CLI to populate (run once per environment — see infra/k8s/vault-init.sh):
    vault kv put secret/vidya/staging \
      DATABASE_URL="postgresql+asyncpg://vidya:<pass>@db-host:5432/vidya" \
      POSTGRES_PASSWORD="<pass>" \
      REDIS_URL="redis://:<pass>@redis-host:6379/0" \
      REDIS_PASSWORD="<pass>" \
      JWT_SECRET="<64-char hex>" \
      EXAM_FERNET_KEY="<base64-fernet-key>" \
      S3_ACCESS_KEY="<key>" \
      S3_SECRET_KEY="<secret>" \
      GEMINI_API_KEY="<key>" \
      GROQ_API_KEY="<key>" \
      SMTP_PASSWORD="<pass>" \
      FLOWER_USER="admin" \
      FLOWER_PASSWORD="<pass>" \
      YOUTUBE_API_KEY="<key>"

  AWS SECRETS MANAGER ALTERNATIVE
  ─────────────────────────────────
  Each remoteRef uses:
    key: <secret-name>        e.g. "vidya-prod/database-url"
    property: DATABASE_URL    (the JSON field within the secret value)
  Set remoteKeyPrefix to a common prefix and adjust per entry.

  GCP SECRET MANAGER ALTERNATIVE
  ────────────────────────────────
  Each remoteRef uses:
    key: projects/<PROJECT>/secrets/<name>/versions/latest
  The `property:` field is omitted when the secret value is the raw string.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vidya.fullname" . }}-secret
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "vidya.fullname" . }}-secret
    creationPolicy: Owner
    # deletionPolicy: Retain keeps the Kubernetes Secret if the ExternalSecret
    # is deleted — prevents accidental credential loss during helm uninstall.
    deletionPolicy: Retain
  data:
    # ── Database ──────────────────────────────────────────────────────────────
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: DATABASE_URL

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: POSTGRES_PASSWORD

    # ── Redis ─────────────────────────────────────────────────────────────────
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: REDIS_URL

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: REDIS_PASSWORD

    # ── Authentication ────────────────────────────────────────────────────────
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: JWT_SECRET

    - secretKey: EXAM_FERNET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: EXAM_FERNET_KEY

    # ── Object storage ────────────────────────────────────────────────────────
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: S3_ACCESS_KEY

    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: S3_SECRET_KEY

    # ── AI providers ──────────────────────────────────────────────────────────
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: GEMINI_API_KEY

    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: GROQ_API_KEY

    # ── Email ─────────────────────────────────────────────────────────────────
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: SMTP_PASSWORD

    # ── Flower ────────────────────────────────────────────────────────────────
    - secretKey: FLOWER_USER
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: FLOWER_USER

    - secretKey: FLOWER_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: FLOWER_PASSWORD

    # ── External APIs ─────────────────────────────────────────────────────────
    - secretKey: YOUTUBE_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix }}
        property: YOUTUBE_API_KEY
{{- end }}
