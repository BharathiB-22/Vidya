{{- /*
  externalsecret.yaml — ESO ExternalSecret (STAGING / PROD path).

  Rendered only when externalSecrets.enabled: true.
  The ExternalSecret instructs the External Secrets Operator to sync
  secrets from the configured backend into a Kubernetes Secret named
  "<release>-vidya-secret", which is the same name the dev Secret uses.
  This means Deployment/envFrom references require no change between paths.

  BACKEND-SPECIFIC KEY FORMAT
  ───────────────────────────
  The remoteRef.key is constructed as:
    {{ .Values.externalSecrets.remoteKeyPrefix }}/{{ secret-name }}
  e.g. with remoteKeyPrefix="vidya": "vidya/database-url"

  Vault (KV v2):
    key  = "<mount>/data/<path>"  e.g. "secret/data/vidya"
    property = "<field>"          e.g. "database-url"
    → Adjust remoteKeyPrefix and add property: fields in values.prod.yaml.

  AWS Secrets Manager:
    key = "<secret-name>"         e.g. "vidya-database-url"
    → Set remoteKeyPrefix="" and use the full secret name per entry.

  GCP Secret Manager:
    key = "projects/<PROJECT>/secrets/<name>/versions/latest"
    → Override remoteKeyPrefix with the full resource path prefix.

  For Vault users, override in values.prod.yaml:
    externalSecrets:
      remoteKeyPrefix: "secret/data/vidya"
  Then each remoteRef resolves to "secret/data/vidya/database-url".
*/ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vidya.fullname" . }}-secret
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "vidya.fullname" . }}-secret
    creationPolicy: Owner
    # deletionPolicy: Retain keeps the Kubernetes Secret if the ExternalSecret
    # is deleted — prevents accidental secret loss during helm uninstall.
    deletionPolicy: Retain
  data:
    # ── Database ─────────────────────────────────────────────────────────────
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ printf "%s/database-url" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ printf "%s/postgres-password" .Values.externalSecrets.remoteKeyPrefix }}

    # ── Redis ─────────────────────────────────────────────────────────────────
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ printf "%s/redis-url" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ printf "%s/redis-password" .Values.externalSecrets.remoteKeyPrefix }}

    # ── Authentication ────────────────────────────────────────────────────────
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ printf "%s/jwt-secret" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: EXAM_FERNET_KEY
      remoteRef:
        key: {{ printf "%s/exam-fernet-key" .Values.externalSecrets.remoteKeyPrefix }}

    # ── Object storage ────────────────────────────────────────────────────────
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ printf "%s/s3-access-key" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ printf "%s/s3-secret-key" .Values.externalSecrets.remoteKeyPrefix }}

    # ── AI providers ──────────────────────────────────────────────────────────
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: {{ printf "%s/gemini-api-key" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: GROQ_API_KEY
      remoteRef:
        key: {{ printf "%s/groq-api-key" .Values.externalSecrets.remoteKeyPrefix }}

    # ── Email ─────────────────────────────────────────────────────────────────
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: {{ printf "%s/smtp-password" .Values.externalSecrets.remoteKeyPrefix }}

    # ── Flower ────────────────────────────────────────────────────────────────
    - secretKey: FLOWER_USER
      remoteRef:
        key: {{ printf "%s/flower-user" .Values.externalSecrets.remoteKeyPrefix }}

    - secretKey: FLOWER_PASSWORD
      remoteRef:
        key: {{ printf "%s/flower-password" .Values.externalSecrets.remoteKeyPrefix }}

    # ── External APIs ─────────────────────────────────────────────────────────
    - secretKey: YOUTUBE_API_KEY
      remoteRef:
        key: {{ printf "%s/youtube-api-key" .Values.externalSecrets.remoteKeyPrefix }}
{{- end }}
