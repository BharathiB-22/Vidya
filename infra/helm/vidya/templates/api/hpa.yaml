{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "vidya.componentName" (list . "api") }}
  labels:
    {{- include "vidya.componentLabels" (list . "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "vidya.componentName" (list . "api") }}
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.cpuUtilizationPercent }}
  behavior:
    scaleUp:
      # Scale up immediately — 0s stabilisation window. New pods take on load
      # as soon as they pass readinessProbe. PRD: scale-up delay = 0s.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # PRD: scale-down delay = 10 min. Prevents thrashing on short traffic spikes.
      stabilizationWindowSeconds: {{ .Values.api.hpa.scaleDownStabilizationSeconds }}
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Max
{{- end }}
