apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vidya.componentName" (list . "api") }}
  labels:
    {{- include "vidya.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "vidya.componentSelectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vidya.componentLabels" (list . "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      {{- include "vidya.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vidya.serviceAccountName" . }}
      # Pod-level securityContext: enforce non-root, set UID/GID to match the
      # vidya user created in the Dockerfile (uid=1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: {{ include "vidya.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            {{- include "vidya.commonEnvFrom" . | nindent 12 }}
          # Container-level securityContext: drop all capabilities, disallow
          # privilege escalation, and use a read-only root filesystem.
          # /tmp is provided as an emptyDir volume for any temp file operations.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # startupProbe: guards against premature liveness kills during cold starts.
          # Gives the container up to (periodSeconds * failureThreshold) seconds
          # to become live before liveness/readiness probes are activated.
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup.path }}
              port: {{ .Values.api.probes.startup.port }}
            initialDelaySeconds: {{ .Values.api.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          # livenessProbe: process-level check — restart the container if it stops
          # responding. /healthz returns 200 even when deps are degraded.
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: {{ .Values.api.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          # readinessProbe: dependency check — remove pod from Service endpoints
          # until DB, Redis, and MinIO connections are all verified. /ready
          # returns 200 only when all dependencies are reachable.
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: {{ .Values.api.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          volumeMounts:
            # /tmp is required for Python temp files (e.g. multipart uploads,
            # subprocess pipes). The root FS is read-only so /tmp must be an
            # explicit writable volume.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
