{{- if .Values.pgbouncer.enabled }}
{{- /*
  PgBouncer Deployment — standalone connection pool (not a sidecar).

  Deviation from PRD "sidecar to vidya-api": standalone prevents connection
  multiplication (N api pods × pool_size → Postgres overload). One shared pool
  is easier to tune and observe; rollback is a single Deployment revision.

  PostgreSQL host resolution:
    postgres.enabled: true  → auto-derived from release name (dev StatefulSet)
    postgres.enabled: false → pgbouncer.postgresHost (managed cloud endpoint)

  Security: edoburu/pgbouncer generates pgbouncer.ini at container start from
  env vars, so readOnlyRootFilesystem is not set. The image declares USER
  "postgres" (non-numeric), which Kubernetes cannot resolve for runAsNonRoot
  validation — no pod-level securityContext is set. Container-level enforcement:
  allowPrivilegeEscalation:false + capabilities.drop:ALL.
*/ -}}
{{- $pgHost := .Values.pgbouncer.postgresHost }}
{{- if .Values.postgres.enabled }}
{{- $pgHost = include "vidya.componentName" (list . "postgres") }}
{{- else }}
{{- $pgHost = required "pgbouncer.postgresHost must be set when postgres.enabled is false — use your managed PostgreSQL endpoint (e.g. db.internal:5432)" .Values.pgbouncer.postgresHost }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vidya.componentName" (list . "pgbouncer") }}
  labels:
    {{- include "vidya.componentLabels" (list . "pgbouncer") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vidya.componentSelectorLabels" (list . "pgbouncer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vidya.componentLabels" (list . "pgbouncer") | nindent 8 }}
    spec:
      {{- include "vidya.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "vidya.serviceAccountName" . }}
      containers:
        - name: pgbouncer
          image: {{ include "vidya.image" (list . .Values.pgbouncer.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: DB_HOST
              value: {{ $pgHost | quote }}
            - name: DB_PORT
              value: {{ .Values.pgbouncer.postgresPort | quote }}
            - name: DB_NAME
              value: {{ .Values.pgbouncer.postgresDatabase | quote }}
            - name: DB_USER
              value: {{ .Values.pgbouncer.postgresUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vidya.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
          ports:
            - name: pgbouncer
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
      {{- with .Values.pgbouncer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pgbouncer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
