apiVersion: v1
kind: Service
metadata:
  name: {{ include "vidya.componentName" (list . "frontend") }}
  labels:
    {{- include "vidya.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vidya.componentSelectorLabels" (list . "frontend") | nindent 4 }}
