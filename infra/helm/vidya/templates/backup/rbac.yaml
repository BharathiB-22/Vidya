{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vidya.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vidya.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "vidya.fullname" . }}-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vidya.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vidya.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vidya.fullname" . }}-backup
subjects:
  - kind: ServiceAccount
    name: {{ include "vidya.fullname" . }}-backup
    namespace: {{ .Release.Namespace }}
{{- end }}
