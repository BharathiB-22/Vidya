apiVersion: v1
kind: Service
metadata:
  name: {{ include "vidya.componentName" (list . "qdrant") }}
  labels:
    {{- include "vidya.componentLabels" (list . "qdrant") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.qdrant.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 6334
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "vidya.componentSelectorLabels" (list . "qdrant") | nindent 4 }}
