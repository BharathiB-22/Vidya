# Nginx config for the Vidya frontend (React SPA).
# Runs as non-root on port 3000.  All temp/pid paths use /tmp so no
# root-owned directories need write access at runtime.
#
# IMPORTANT — Nginx add_header inheritance rule:
# A location block that contains any add_header directive does NOT inherit
# add_header directives from the parent server block.  To keep security
# headers on every response, no location block uses add_header.  Cache
# control is handled via the `expires` directive instead.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Route all temp files to /tmp so the non-root vidya user can write them.
    client_body_temp_path /tmp/nginx-client-temp 1 2;
    proxy_temp_path       /tmp/nginx-proxy-temp  1 2;
    fastcgi_temp_path     /tmp/nginx-fastcgi-temp 1 2;
    uwsgi_temp_path       /tmp/nginx-uwsgi-temp  1 2;
    scgi_temp_path        /tmp/nginx-scgi-temp   1 2;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version from Server response header and error pages.
    server_tokens off;

    # Ship logs to stdout/stderr so the container runtime collects them.
    access_log /dev/stdout combined;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 3000;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ─────────────────────────────────────────────
        # These are declared ONLY at the server level.  No location block
        # below uses add_header, which guarantees every response inherits
        # all of these headers via Nginx's inheritance rule.

        # Prevent embedding in iframes from other origins.
        add_header X-Frame-Options         "SAMEORIGIN"                       always;
        # Prevent MIME-type sniffing.
        add_header X-Content-Type-Options  "nosniff"                          always;
        # Disable the legacy XSS auditor (deprecated; can introduce
        # vulnerabilities in older browsers when set to 1).
        add_header X-XSS-Protection        "0"                                always;
        # Limit referrer information sent to cross-origin requests.
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        # Enforce HTTPS for 2 years on all subdomains with preload eligibility.
        # Requires TLS at the Ingress layer (cert-manager + Let's Encrypt, H05-02).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # Prevent cross-origin popups from retaining a reference to this window.
        add_header Cross-Origin-Opener-Policy "same-origin"                        always;
        # Restrict browser feature access — no camera, mic, geolocation, or payment.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # CSP: unsafe-inline required for React/Vite until nonce injection is added.
        # connect-src 'self' assumes the API is on the same origin via Ingress rewrite.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';" always;

        # ── Routing ──────────────────────────────────────────────────────
        # React Router: fall back to index.html for any path not matched by
        # a static file so client-side navigation works correctly.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Cache control ────────────────────────────────────────────────
        # Vite generates content-hashed filenames under /assets/.  A one-year
        # cache is safe because any content change produces a new filename.
        # `expires` is used (not add_header) to preserve security header
        # inheritance from the server block above.
        location ^~ /assets/ {
            expires 1y;
            access_log off;
        }

        # index.html must never be cached — the browser must fetch it fresh
        # on every navigation so updated asset hashes take effect immediately.
        # `expires -1` sets Cache-Control: no-cache and an Expires date in
        # the past.
        location = /index.html {
            expires -1;
        }
    }
}
