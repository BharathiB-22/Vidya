version: "3.9"

services:
  vidya-api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vidya:vidya_dev@postgres:5432/vidya?ssl=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant

  vidya-worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q celery --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vidya:vidya_dev@postgres:5432/vidya?ssl=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  vidya-worker-heavy:
    build: ./backend
    command: celery -A app.workers.celery_app worker -Q celery-heavy --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vidya:vidya_dev@postgres:5432/vidya?ssl=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  vidya-frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file: .env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vidya
      POSTGRES_PASSWORD: vidya_dev
      POSTGRES_DB: vidya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9400:9000"
      - "9401:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  flower:
    image: mher/flower
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # ── Observability stack ───────────────────────────────────────────────────────

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    ports:
      - "9080:9080"
    volumes:
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/vidya-api-golden-signals.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_NAME=postgresql://vidya:vidya_dev@postgres:5432/vidya?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.61.0
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  loki_data:
