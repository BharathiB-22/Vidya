[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidya-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.2.0",
    "slowapi>=0.1.9",
    "email-validator>=2.1.0",
    "boto3>=1.28.0",
    "google-genai>=2.0.0",
    "openai>=1.30.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    # Slide text measurement (m03/presentation/text_metrics.py). Both arrive
    # transitively via reportlab/python-pptx today; pinned explicitly because
    # M03 now imports them directly and a transitive dep is not a contract.
    "pillow>=10.0.0",
    "fonttools>=4.40.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.9",
    "tenacity>=8.2",
    "scipy>=1.13.0",
    "celery[redis]>=5.4.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.28.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/workers/*",      # Celery worker entrypoint — tested via task mocks
    "app/core/monitoring/setup_logging.py",  # logging bootstrap
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/"]

[tool.ruff.lint]
select = ["F"]
